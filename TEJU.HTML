<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook - Movie Ticket Management</title>

    <style>
        :root {
            --primary: #e50914;
            --dark: #141414;
            --light: #f5f5f5;
            --gray: #333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 0;
        }

        header {
            background: black;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            color: var(--primary);
        }

        .nav-btn {
            background: var(--gray);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            margin-left: 10px;
            border-radius: 5px;
        }

        .nav-btn.active {
            background: var(--primary);
        }

        .container {
            padding: 20px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--gray);
            border-radius: 8px;
            overflow: hidden;
        }

        .movie-poster {
            height: 150px;
            background: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        .movie-details {
            padding: 15px;
        }

        .movie-title {
            font-size: 20px;
            font-weight: bold;
        }

        .movie-info {
            margin: 8px 0;
            color: #ccc;
        }

        .book-btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .book-btn:disabled {
            background: gray;
        }

        .admin-panel {
            background: var(--gray);
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--gray);
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
        }

        .close-btn {
            margin-top: 10px;
            background: #555;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        #notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: green;
            color: white;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .ticket-receipt {
            background: white;
            color: black;
            padding: 20px;
            margin-top: 20px;
            border-left: 6px solid red;
            border-radius: 8px;
        }

        .ticket-receipt h2 {
            margin-top: 0;
            color: red;
        }
    </style>
</head>

<body>

<header>
    <h1>CineBook</h1>

    <nav>
        <button class="nav-btn active" onclick="showSection('user-view', event)">User View</button>
        <button class="nav-btn" onclick="showSection('admin-view', event)">Admin Panel</button>
    </nav>
</header>

<!-- USER VIEW -->
<div id="user-view" class="container section active">

    <h2>Now Showing</h2>

    <div class="movie-grid" id="movie-list"></div>

    <!-- TICKET DISPLAY -->
    <div id="ticket-container"></div>

</div>

<!-- ADMIN VIEW -->
<div id="admin-view" class="container section">

    <div class="admin-panel">

        <h2>Add New Movie</h2>

        <div class="form-group">
            <label>Movie Title</label>
            <input type="text" id="new-title">
        </div>

        <div class="form-group">
            <label>Show Time</label>
            <input type="time" id="new-time">
        </div>

        <div class="form-group">
            <label>Ticket Price</label>
            <input type="number" id="new-price">
        </div>

        <div class="form-group">
            <label>Total Seats</label>
            <input type="number" id="new-seats">
        </div>

        <button class="book-btn" onclick="addMovie()">Add Movie</button>

    </div>

</div>

<!-- BOOKING MODAL -->
<div id="booking-modal" class="modal">

    <div class="modal-content">

        <h2>Book Ticket</h2>

        <p id="modal-movie-name"></p>

        <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="customer-name">
        </div>

        <div class="form-group">
            <label>Number of Seats</label>
            <input type="number" id="seat-count" value="1" min="1">
        </div>

        <button class="book-btn" onclick="confirmBooking()">Confirm Booking</button>

        <button class="close-btn" onclick="closeModal()">Cancel</button>

    </div>

</div>

<!-- NOTIFICATION -->
<div id="notification"></div>

<script>

    const defaultMovies = [
        {
            id: 1,
            title: "The Matrix",
            time: "14:30",
            price: 12,
            seats: 50,
            booked: 0
        },
        {
            id: 2,
            title: "Avengers: Endgame",
            time: "18:00",
            price: 15,
            seats: 100,
            booked: 10
        },
        {
            id: 3,
            title: "Interstellar",
            time: "20:45",
            price: 10,
            seats: 30,
            booked: 25
        }
    ];

    let movies = JSON.parse(localStorage.getItem('cinebook_movies')) || defaultMovies;

    let currentMovieId = null;

    function saveData() {
        localStorage.setItem('cinebook_movies', JSON.stringify(movies));
    }

    function renderMovies() {

        const container = document.getElementById('movie-list');

        container.innerHTML = '';

        movies.forEach(movie => {

            const available = movie.seats - movie.booked;

            const card = document.createElement('div');

            card.className = 'movie-card';

            card.innerHTML = `
                <div class="movie-poster">🎬</div>

                <div class="movie-details">

                    <div class="movie-title">${movie.title}</div>

                    <div class="movie-info">
                        Time: ${movie.time}
                    </div>

                    <div class="movie-info">
                        Price: $${movie.price}
                    </div>

                    <div class="movie-info">
                        Seats Available: ${available}/${movie.seats}
                    </div>

                    <button 
                        class="book-btn"
                        onclick="openBooking(${movie.id})"
                        ${available <= 0 ? 'disabled' : ''}
                    >
                        ${available <= 0 ? 'Sold Out' : 'Book Now'}
                    </button>

                </div>
            `;

            container.appendChild(card);

        });

    }

    function showSection(id, event) {

        document.querySelectorAll('.section').forEach(section => {
            section.classList.remove('active');
        });

        document.getElementById(id).classList.add('active');

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        event.target.classList.add('active');

    }

    function openBooking(id) {

        currentMovieId = id;

        const movie = movies.find(m => m.id === id);

        document.getElementById('modal-movie-name').innerText = movie.title;

        document.getElementById('booking-modal').style.display = 'flex';

    }

    function closeModal() {

        document.getElementById('booking-modal').style.display = 'none';

        document.getElementById('customer-name').value = '';

        document.getElementById('seat-count').value = 1;

    }

    function confirmBooking() {

        const name = document.getElementById('customer-name').value;

        const count = parseInt(document.getElementById('seat-count').value);

        if (!name) {
            alert("Please enter your name");
            return;
        }

        const movieIndex = movies.findIndex(m => m.id === currentMovieId);

        const movie = movies[movieIndex];

        if (count > (movie.seats - movie.booked)) {

            alert("Not enough seats available!");

            return;
        }

        movies[movieIndex].booked += count;

        saveData();

        renderMovies();

        closeModal();

        showNotification("Ticket Booked Successfully!");

        // SHOW TICKET
        document.getElementById('ticket-container').innerHTML = `
            <div class="ticket-receipt">

                <h2>🎟 Movie Ticket</h2>

                <p><strong>Movie:</strong> ${movie.title}</p>

                <p><strong>Name:</strong> ${name}</p>

                <p><strong>Seats:</strong> ${count}</p>

                <p><strong>Total Price:</strong> $${count * movie.price}</p>

                <p><strong>Show Time:</strong> ${movie.time}</p>

                <p><strong>Booking Time:</strong> ${new Date().toLocaleString()}</p>

            </div>
        `;

    }

    function addMovie() {

        const title = document.getElementById('new-title').value;

        const time = document.getElementById('new-time').value;

        const price = parseFloat(document.getElementById('new-price').value);

        const seats = parseInt(document.getElementById('new-seats').value);

        if (!title || !time || !price || !seats) {

            alert("Please fill all fields");

            return;
        }

        const newMovie = {
            id: movies.length + 1,
            title,
            time,
            price,
            seats,
            booked: 0
        };

        movies.push(newMovie);

        saveData();

        renderMovies();

        showNotification("Movie Added Successfully!");

        document.getElementById('new-title').value = '';
        document.getElementById('new-time').value = '';
        document.getElementById('new-price').value = '';
        document.getElementById('new-seats').value = '';

    }

    function showNotification(message) {

        const notification = document.getElementById('notification');

        notification.innerText = message;

        notification.style.display = 'block';

        setTimeout(() => {
            notification.style.display = 'none';
        }, 3000);

    }

    renderMovies();

</script>

</body>
</html>
